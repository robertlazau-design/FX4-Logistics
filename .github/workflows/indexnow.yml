# Tells Bing and the other IndexNow search engines (Yandex, Seznam, Naver...) about the site's
# pages right after Vercel deploys a merge to main. Google doesn't use IndexNow; it reads the sitemap.
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/portal/**"
      - "public/**"
      - "index.html"
      - "scripts/**"
      - "vercel.json"
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the deploy, then submit the site's pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/indexnow.py
